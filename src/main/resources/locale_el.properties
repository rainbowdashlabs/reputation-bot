selfCleanup.prompt=Γεια, φαίνεται ότι δεν με χρησιμοποιείς.\nΔεν έχω ρυθμιστεί για περισσότερες από %DAYS_UNCONFIGURED% ημέρες ή δεν έχει δοθεί φήμη τις τελευταίες %INACTIVE_DAYS%.\nΑν δεν είμαι ρυθμισμένος, χρησιμοποίησε την εντολή /setup.\nΑν δεν με ρυθμίσεις ή δεν με χρησιμοποιήσεις τις επόμενες %DAYS% ημέρες, θα φύγω.
selfCleanup.prompt.title=Παρακαλώ ρυθμίστε με.
