selfCleanup.leave=Ви не налаштували мене. Я залишаюся тільки в активних гільдіях, які мають принаймні один канал репутації. Якщо ви хочете знову скористатися моїми послугами, ви можете запросити мене в будь-який час за цим [посиланням](%INVITE%).
