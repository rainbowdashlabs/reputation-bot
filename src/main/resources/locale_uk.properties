selfCleanup.prompt=Привіт, схоже, ти мене не використовуєш.\nЯ не налаштований на більше ніж %DAYS_UNCONFIGURED% днів або не отримав репутацію за останні %INACTIVE_DAYS%.\nЯкщо я не налаштований, використовуй команду /setup.\nЯкщо ти не налаштуєш або не використаєш мене протягом наступних %DAYS% днів, я піду.
selfCleanup.prompt.title=Будь ласка, налаштуйте мене.
