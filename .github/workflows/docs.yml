name: docs

on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15
      - run: pip install pipenv && pipenv install && pipenv run mkdocs gh-deploy --force
