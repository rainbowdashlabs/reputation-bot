name: Verify

on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 25
  NODE_VERSION: 24
  PYTHON_VERSION: 3.14

jobs:
  verify-format:
    name: Verify Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck

  verify-tests:
    name: Verify Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  verify-database:
    name: Verify Database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDatabase

  verify-locales:
    name: Verify Locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testLocale
      - name: Check frontend locale variables and extra keys
        working-directory: tooling
        run: python3 -m frontend_locales --checks 3 4
      - name: Report frontend locale coverage
        working-directory: tooling
        run: python3 -m frontend_locales --checks 1 2 || true

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --build-cache build -x spotlessCheck -x test

  verify-frontend:
    name: Verify Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc -b --noEmit
      - run: npm run build

  verify-image:
    name: Verify Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  verify:
    name: Verify
    if: always()
    needs: [verify-format, verify-tests, verify-database, verify-locales, verify-build, verify-frontend, verify-image]
    runs-on: ubuntu-latest
    steps:
      - name: All verifications passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
